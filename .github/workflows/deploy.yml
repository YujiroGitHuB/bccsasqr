name: Deploy to InfinityFree
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    environment: Server   
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: /lexon.free.nf/htdocs/bccsasqr/
          # Every line below is a glob, not YAML — a "#" here would be treated
          # as a pattern, so keep explanations outside the block.
          #
          # uploads/** matters: user uploads live on the server and never in
          # the repo, so without it the deploy sees every banner, avatar, and
          # response attachment as an orphan and deletes it. An uploaded
          # banner only survived until the next push. Excluded paths are
          # skipped entirely — not uploaded, not deleted.
          #
          # backups/** is the same story: the in-app backup feature writes its
          # .sql dumps on the server, so an unexcluded backups/ means every
          # push wipes the dumps it finds there.
          #
          # bccsasqr-mobile/** is the Flutter app. It is source for a phone,
          # not files a web server ever serves — and android/ + ios/ alone are
          # hundreds of files against InfinityFree's inode limit. Its build
          # artifacts are already kept out of git by the Flutter project's own
          # .gitignore; this keeps its source out of the web root.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README.md
            uploads/**
            backups/**
            bccsasqr-mobile/**