name: Deploy to Hostinger
on:
  push:
    branches:
      - main
    # A push that touches only the Flutter app has nothing to send — the
    # folder is in EXCLUDE below — so skip the run instead of spending one
    # on a no-op. A push that also changes the website still deploys:
    # paths-ignore only skips when EVERY changed file matches.
    paths-ignore:
      - 'bccsasqr-mobile/**'
  workflow_dispatch:

concurrency:
  # Two pushes in quick succession used to mean two rsyncs writing into the
  # same web root at once. The later one wins and the earlier is pointless,
  # so cancel it rather than race.
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    name: rsync over SSH
    runs-on: ubuntu-latest
    environment: Server

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to Hostinger
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST:     ${{ secrets.SSH_HOST }}
          REMOTE_USER:     ${{ secrets.SSH_USER }}
          REMOTE_PORT:     ${{ secrets.SSH_PORT }}
          TARGET:          ${{ secrets.REMOTE_TARGET }}
          SOURCE: "./"
          # Overriding this replaces the action's default, so the
          # StrictHostKeyChecking flag has to be repeated here — a fresh
          # runner has never seen this host and would otherwise stop to ask.
          #
          # ConnectTimeout is the reason for the override. A host that is
          # simply not listening on 65002 (SSH switched off in hPanel, or
          # SSH_HOST pointing at the web front end instead of the SSH server)
          # leaves ssh waiting through its default timeout, and the job burns
          # five minutes before saying anything. Fifteen seconds is far more
          # than a reachable server needs, and turns that into a fast, legible
          # failure.
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no -o ConnectTimeout=15"
          # -c compares by checksum, not timestamp: a fresh `checkout` gives
          # every file the time of the clone, so a timestamp comparison would
          # re-upload the whole site on every push.
          # --delete removes what is no longer in the repo. It does NOT touch
          # anything in EXCLUDE below — that is the whole reason those live
          # there and not in .gitignore alone.
          ARGS: "-rlzvc -i --delete"
          # Comma-separated, each one passed to rsync as --exclude.
          #
          # uploads/ and backups/ are written by the running app on the
          # server and exist in no commit. Without them here, --delete reads
          # every student photo and every .sql dump as an orphan and removes
          # it — an uploaded banner would survive only until the next push.
          #
          # includes/db_credentials.php is the live database login. It is
          # created once on the server by hand (see db_credentials.example.php)
          # and must outlive every deploy. Under the old FTP action only
          # changed files were sent, so hand-edited server files survived by
          # accident; rsync overwrites, so the protection has to be explicit.
          #
          # bccsasqr-mobile/ is Flutter source — files for a phone, never
          # something a web server serves.
          #
          # assets/images/logo_* and letterhead_* are the system logo and
          # the report letterhead uploaded in Settings
          # (crud/update_system_config.php writes them there, not to
          # uploads/). Like uploads/, they exist in no commit, so --delete
          # removed them: a logo uploaded on 2026-09-23 was gone by the
          # next push and the live site showed a broken image.
          EXCLUDE: "/.git/, /.github/, /node_modules/, /README.md, /uploads/, /backups/, /bccsasqr-mobile/, /assets/images/logo_*, /assets/images/letterhead_*, /includes/db_credentials.php, /includes/db_error.log, .mcp.json, .DS_Store, Thumbs.db"
